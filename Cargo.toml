[workspace]
members = ["crates/derive"]

# Shared metadata for every crate in the workspace. [workspace.package].version
# is the single source of truth — the PyPI wheel (maturin dynamic version) and
# the release tag both derive from it, and each crate inherits it via
# `version.workspace = true`.
[workspace.package]
version = "1.1.0"
license = "MIT"
repository = "https://github.com/osullivryan/dynars"

# dynars-derive (the proc-macro crate — it must be its own crate, as derive
# macros always are) is pulled by `path` for local builds and by `version` when
# published: cargo strips `path` from the uploaded manifest and keeps `version`.
# Centralized here so a version bump touches one file.
[workspace.dependencies]
dynars-derive = { path = "crates/derive", version = "1.0.0" }

[package]
name = "dynars"
version.workspace = true
edition = "2024"
license.workspace = true
repository.workspace = true
description = "High-performance LS-DYNA keyword file parser (Rust + numpy)"

# docs.rs renders the Rust API. Build the signal + ffi + arrow feature docs (skip
# the heavy `typed-keywords` and the Python bindings, which have their own docs).
[package.metadata.docs.rs]
features = ["signal", "ffi", "arrow"]

[lib]
name = "dynars"
# staticlib/cdylib are for the C/Fortran FFI (build with `--features ffi`); rlib
# is for Rust consumers. The FFI module is gated on the `ffi` feature, so a plain
# build compiles none of the `unsafe` boundary code.
crate-type = ["cdylib", "rlib", "staticlib"]

[[bin]]
name = "dynars"
path = "src/main.rs"

# The arrow example needs the optional `arrow` feature to compile.
[[example]]
name = "arrow_dump"
required-features = ["arrow"]

[features]
default = []
python = ["pyo3", "numpy", "signal"]
# Numerical post-processing of result time-histories: SAE J211 CFC filters,
# general Butterworth (via iir_filters), cumulative integrate/differentiate.
# Opt-in so a plain deck-parsing build stays lean; folded into `python`.
signal = ["iir_filters", "num-complex"]
# C ABI / Fortran bindings for the deck parse + validate path (see src/ffi.rs
# and examples/ffi/). Off by default so the `unsafe` layer is never built unless
# asked for.
ffi = []
# Generated typed struct per keyword (~3170). Opt-in — adds a one-time compile.
typed-keywords = []
# Convert binout/d3plot results into Apache Arrow RecordBatches (the Parquet /
# Iceberg seam, `dynars::arrow`). Opt-in so the fast core never pulls arrow-rs.
arrow = ["dep:arrow"]

[dependencies]
rayon = "1.10"
memmap2 = "0.9"
memchr = "2.7"
dashmap = "6"
clap = { version = "4", features = ["derive"] }
pyo3 = { version = "0.29", features = ["extension-module", "experimental-inspect", "abi3-py39"], optional = true }
numpy = { version = "0.29", optional = true }
lexical-core = "1.0.6"
byteorder = "1.5"
glob = "0.3"
iir_filters = { version = "0.1", optional = true }
num-complex = { version = "0.4", optional = true }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dynars-derive.workspace = true
# Optional: Arrow conversion (feature `arrow`, module `dynars::arrow`). Heavy —
# kept out of the fast core, and never pulled by a default/`python` build.
arrow = { version = "53", optional = true }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
