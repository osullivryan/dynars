[workspace]
members = ["dynars-derive", "crates/arrow"]

[package]
name = "dynars"
version = "0.1.0"
edition = "2024"

[lib]
name = "dynars"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "dynars"
path = "src/main.rs"

[features]
default = []
python = ["pyo3", "numpy"]
# Generated typed struct per keyword (~3170). Opt-in — adds a one-time compile.
typed-keywords = []

[dependencies]
rayon = "1.10"
memmap2 = "0.9"
memchr = "2.7"
dashmap = "6"
crossbeam = "0.8"
clap = { version = "4", features = ["derive"] }
pyo3 = { version = "0.29", features = ["extension-module", "experimental-inspect", "abi3-py39"], optional = true }
numpy = { version = "0.29", optional = true }
lexical-core = "1.0.6"
byteorder = "1.5"
glob = "0.3"
thiserror = "2"
dynars-derive = { path = "dynars-derive", version = "0.1.0" }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
