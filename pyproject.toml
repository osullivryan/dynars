[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "dynars"
# Single source of truth for the version is Cargo.toml [package].version.
# `dynamic = ["version"]` tells maturin to read the wheel version from there,
# so the PyPI version always equals the crate version (no drift between the two).
dynamic = ["version"]
description = "High-performance LS-DYNA keyword file parser (Rust + numpy)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Ryan O'Sullivan" }]
keywords = ["ls-dyna", "keyword", "parser", "cae", "fea", "numpy"]
dependencies = ["numpy"]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Topic :: Scientific/Engineering",
    "Intended Audience :: Science/Research",
]

# Heavy, optional integrations — kept out of the fast core install.
[project.optional-dependencies]
parquet = ["pyarrow>=14"]
iceberg = ["pyarrow>=14", "pyiceberg[sql-sqlite]>=0.7"]

[project.urls]
Repository = "https://github.com/osullivryan/dynars"

[tool.maturin]
features = ["python"]
module-name = "dynars._dynars"
python-source = "python"
# NOTE: `generate-stubs` is NOT a pyproject key (maturin silently ignores it).
# Regenerate python/dynars/_dynars.pyi with:
#   maturin generate-stubs --features python --out python/dynars
# Requires pyo3's `experimental-inspect` feature (enabled in Cargo.toml).
