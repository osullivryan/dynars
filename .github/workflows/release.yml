name: Release

# Build wheels for Linux + Windows and publish to PyPI.
# (macOS is omitted to save CI minutes; mac users install from the sdist.)
# Because the extension is built with pyo3 `abi3-py39`, each job produces a
# single wheel per platform that works on CPython 3.9+ (no per-version matrix).
#
# Releases are CUT FROM THE ACTIONS TAB: open Actions -> Release -> "Run
# workflow" (workflow_dispatch, on `main`). That builds + smoke-tests, tags the
# current Cargo.toml version as vX.Y.Z, and publishes to PyPI via Trusted
# Publishing (OIDC) — no API token or secret, all in one run. Pushes to main and
# PRs only build + smoke-test; they never tag or publish.
#
# Wheels build in release mode (`--release`, so LTO + opt-level 3 from
# [profile.release] apply). The version lives in ONE place, Cargo.toml
# [package].version: maturin derives the wheel version from it (pyproject.toml
# sets dynamic version) and the tag is derived from it too, so
# tag == crate version == PyPI version by construction. See notes at the bottom.

on:
  push:
    branches: [main]        # build-test only
  pull_request:             # build-test only
  workflow_dispatch:        # ← "Cut release": build, tag the Cargo version, publish

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          manylinux: auto
      - uses: actions/upload-artifact@v6
        with:
          name: wheels-linux-${{ matrix.target }}
          path: dist

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: x64
          args: --release --out dist
      - uses: actions/upload-artifact@v6
        with:
          name: wheels-windows-x64
          path: dist

  sdist:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v6
        with:
          name: wheels-sdist
          path: dist

  # Smoke-test the built wheel on each OS before we'd ever tag or publish.
  smoke-test:
    needs: [linux, windows]
    strategy:
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v6
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - name: Install and import
        shell: bash
        run: |
          python -m pip install numpy
          python -m pip install --no-index --find-links dist dynars
          python -c "import dynars, dynars.kw; print('import OK, e.g.', dynars.kw.MAT_ELASTIC)"

  # Cut the release tag (dispatch only), once the wheels are built and tested.
  # The tag is derived FROM Cargo.toml's version, so tag == crate version by
  # construction; if that tag already exists, fail loudly (bump Cargo.toml first).
  tag:
    name: Cut release tag
    if: github.event_name == 'workflow_dispatch'
    needs: [smoke-test, sdist]
    runs-on: ubuntu-22.04
    permissions:
      contents: write        # push the tag
    outputs:
      version: ${{ steps.cut.outputs.version }}
    steps:
      - uses: actions/checkout@v6
      - id: cut
        name: Tag Cargo.toml version as vX.Y.Z
        run: |
          VERSION=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name=="dynars") | .version')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing dynars v$VERSION"
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null 2>&1; then
            echo "::error::tag v$VERSION already exists — bump Cargo.toml [package].version before cutting a release"
            exit 1
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "dynars v$VERSION"
          git push origin "v$VERSION"

  # Publish every built artifact (Linux + Windows wheels + sdist) to PyPI, using
  # Trusted Publishing (OIDC): no token, no secret. Runs only after the tag is
  # cut, so PyPI and the git tag always agree.
  publish:
    name: Publish to PyPI
    if: github.event_name == 'workflow_dispatch'
    needs: [tag, smoke-test, sdist]
    runs-on: ubuntu-22.04
    environment:
      name: pypi
      url: https://pypi.org/p/dynars
    permissions:
      id-token: write          # OIDC — tokenless "trusted publishing"; the only
                               # permission the publish step needs.
    steps:
      - uses: actions/download-artifact@v6
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist

# ---------------------------------------------------------------------------
# One-time PyPI Trusted Publisher setup (no API token is ever stored here).
#
# 1. GitHub: create an Environment named `pypi`
#    (Settings -> Environments -> New environment). Optionally add required
#    reviewers so a human approves each release before `publish` runs.
#    (Tag pushes use the default GITHUB_TOKEN; if you add a tag protection
#    ruleset, allow github-actions to create `v*` tags.)
#
# 2. PyPI: add a GitHub Actions trusted publisher for the `dynars` project
#    (https://pypi.org/manage/project/dynars/settings/publishing/, or — if the
#    project does not exist yet — add a "pending publisher" at
#    https://pypi.org/manage/account/publishing/). Enter exactly:
#        Owner:            osullivryan
#        Repository name:  dynars
#        Workflow name:    release.yml
#        Environment name: pypi
#
# 3. Cut a release. The version lives in ONE place — Cargo.toml
#    [package].version — and the wheel + tag both derive from it:
#        a. bump `version` in Cargo.toml (e.g. 0.1.0 -> 0.1.1), commit, push main;
#        b. Actions -> Release -> "Run workflow" (on main).
#    The run builds release wheels, smoke-tests them, tags v0.1.1 (failing if it
#    already exists — i.e. you forgot to bump), then publishes to PyPI. No tag to
#    type by hand, and tag/wheel/PyPI versions can't drift.
# ---------------------------------------------------------------------------
