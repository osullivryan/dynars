name: Release

# Build wheels for Linux + Windows and publish to PyPI on tag.
# (macOS is omitted to save CI minutes; mac users install from the sdist.)
# Because the extension is built with pyo3 `abi3-py39`, each job produces a
# single wheel per platform that works on CPython 3.9+ (no per-version matrix).
#
# Wheels are built in release mode (`--release`, so LTO + opt-level 3 from
# [profile.release] apply); publishing uses PyPI Trusted Publishing (OIDC) — no
# API token or secret. See the setup notes at the bottom of this file.

on:
  push:
    branches: [main]        # build-test on pushes to main
    tags: ["v*"]            # v1.2.3 -> build + publish
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          manylinux: auto
      - uses: actions/upload-artifact@v6
        with:
          name: wheels-linux-${{ matrix.target }}
          path: dist

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: x64
          args: --release --out dist
      - uses: actions/upload-artifact@v6
        with:
          name: wheels-windows-x64
          path: dist

  sdist:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v6
        with:
          name: wheels-sdist
          path: dist

  # Smoke-test the built wheel on each OS before we'd ever publish.
  smoke-test:
    needs: [linux, windows]
    strategy:
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v6
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - name: Install and import
        shell: bash
        run: |
          python -m pip install numpy
          python -m pip install --no-index --find-links dist dynars
          python -c "import dynars, dynars.kw; print('import OK, e.g.', dynars.kw.MAT_ELASTIC)"

  # Publish every built artifact (Linux + Windows wheels + sdist) to PyPI on a
  # version tag, using Trusted Publishing (OIDC): no token, no secret. Gated on
  # the smoke-test passing, so a broken wheel never reaches PyPI.
  publish:
    name: Publish to PyPI
    if: startsWith(github.ref, 'refs/tags/')
    needs: [smoke-test, sdist]
    runs-on: ubuntu-22.04
    environment:
      name: pypi
      url: https://pypi.org/p/dynars
    permissions:
      id-token: write          # OIDC — tokenless "trusted publishing"; the only
                               # permission the publish step needs.
    steps:
      - uses: actions/download-artifact@v6
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist

# ---------------------------------------------------------------------------
# One-time PyPI Trusted Publisher setup (no API token is ever stored here).
#
# 1. GitHub: create an Environment named `pypi`
#    (Settings -> Environments -> New environment). Optionally add required
#    reviewers so a human approves each release.
#
# 2. PyPI: add a GitHub Actions trusted publisher for the `dynars` project
#    (https://pypi.org/manage/project/dynars/settings/publishing/, or — if the
#    project does not exist yet — add a "pending publisher" at
#    https://pypi.org/manage/account/publishing/). Enter exactly:
#        Owner:            osullivryan
#        Repository name:  dynars
#        Workflow name:    release.yml
#        Environment name: pypi
#
# 3. Push a tag: `git tag v0.1.0 && git push origin v0.1.0`. The linux/windows/
#    sdist jobs build (release mode) and smoke-test; then `publish` mints a
#    short-lived OIDC token and uploads to PyPI.
# ---------------------------------------------------------------------------
